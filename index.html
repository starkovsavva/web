<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тетрис</title>
  <link rel="stylesheet" href="tetris.styles.css">
</head>
<body>

<div class="game-container">
  <canvas id="game-board" width="300" height="600"></canvas>

  <div class="login-container">
    <div class="subtitle">Введите имя для начала игры</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Имя игрока:</label>
        <input type="text" id="username" placeholder="Введите ваше имя" required>
      </div>
      <button type="submit" class="btn">Начать игру</button>
    </form>

    <div class="features">
      <h3>Ваша статистика:</h3>
      <ul>
        <li>Рекорды и достижения</li>
        <li>Таблица лидеров</li>
        <li>История игр</li>
        <li>Уровень мастерства</li>
      </ul>
    </div>
  </div>
  <div class="leaderboard hidden">
    <h3>Таблица лидеров</h3>
    <div class="leaderboard-list" id="leaderboardList">
      <!-- Сюда будет вставляться лидерборд -->
    </div>

  <div class="info-panel">
    <h3>Статистика</h3>
    <div id="score">Счет: 0</div>
    <div id="level">Уровень: 1</div>
    <div id="lines">Линии: 0</div>

    <div class="controls">
      <button onclick="window.game?.pauseGame()">Пауза</button>
      <button onclick="window.game?.restartGame()">Перезапуск</button>
    </div>

    <div class="instructions">
      <h4>Управление:</h4>
      <p>← → - Движение</p>
      <p>↓ - Ускорить</p>
      <p>Пробел - Поворот</p>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
